<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程管家 V2</title>
<style>body{font-family:-apple-system,"PingFang TC",sans-serif;background:#f5f1eb;color:#29251f;margin:0}.app{max-width:760px;margin:auto;padding:18px 14px 90px}.card{background:#fff;border:1px solid #e5ddd2;border-radius:17px;padding:15px;margin:9px 0}h1{font-size:23px}h2{font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat b{font-size:21px;display:block}.muted{font-size:12px;color:#777066}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #e5ddd2;border-radius:11px;font:inherit}textarea{min-height:75px}.btn{border:0;border-radius:12px;padding:11px;background:#725d4b;color:white;font-weight:700}.alt{background:#eee5da;color:#29251f}.danger{background:#f2dfdd;color:#94483f}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.page{display:none}.page.on{display:block}.item{display:flex;justify-content:space-between;gap:8px}.badge{background:#eee5da;padding:5px 8px;border-radius:999px;font-size:11px;height:max-content}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;justify-content:center;gap:18px}nav button{border:0;background:none}@media(max-width:430px){.row{grid-template-columns:1fr}}@media print{nav,.np{display:none!important}}</style></head>
<body><div class="app"><h1>工程管家 <span class="badge">V2</span></h1>
<section id="home" class="page on"><div class="grid"><div class="card stat"><span class="muted">進行中</span><b id="a">0</b></div><div class="card stat"><span class="muted">待收款</span><b id="d">$0</b></div><div class="card stat"><span class="muted">本月已收</span><b id="r">$0</b></div><div class="card stat"><span class="muted">預估毛利</span><b id="g">$0</b></div></div><button class="btn np" onclick="fresh()">＋ 新增工程</button><h2>近期案件</h2><div id="recent"></div></section>
<section id="jobs" class="page"><h2>案件管理</h2><input id="search" placeholder="搜尋姓名／電話／地址／工程" oninput="list()"><div id="list"></div></section>
<section id="edit" class="page"><h2 id="et">新增工程</h2><div class="card"><input type="hidden" id="id"><label>客戶姓名</label><input id="client"><div class="row"><div><label>電話</label><input id="phone"></div><div><label>工程類型</label><select id="type"><option>冷氣安裝</option><option>冷氣維修</option><option>水電工程</option><option>弱電工程</option><option>居家修繕</option><option>裝潢工程</option><option>其他</option></select></div></div><label>施工地址</label><input id="addr"><div class="row"><div><label>施工日期</label><input id="date" type="date"></div><div><label>狀態</label><select id="status"><option>待報價</option><option>已報價</option><option>已預約</option><option>施工中</option><option>已完工</option></select></div></div><div class="row"><div><label>材料成本</label><input id="cost" type="number" value="0"></div><div><label>材料報價</label><input id="mat" type="number" value="0"></div></div><div class="row"><div><label>工資</label><input id="labor" type="number" value="0"></div><div><label>其他費用</label><input id="other" type="number" value="0"></div></div><div class="row"><div><label>已收款</label><input id="paid" type="number" value="0"></div><div><label>保固至</label><input id="warranty" type="date"></div></div><label>施工備註</label><textarea id="note"></textarea><label>施工照片（最多 6 張）</label><input id="pics" type="file" accept="image/*" multiple><button class="btn" onclick="save()">儲存案件</button> <button class="btn danger" id="del" style="display:none" onclick="removeJob()">刪除</button></div></section>
<section id="cal" class="page"><h2>工程日程</h2><div id="calList"></div></section>
<section id="quote" class="page"><h2>快速報價</h2><div class="card"><input id="qn" placeholder="客戶｜工程"><div class="row"><input id="qm" type="number" value="0" oninput="cq()"><input id="ql" type="number" value="0" oninput="cq()"></div><input id="qo" type="number" value="0" oninput="cq()"><h2>總額 <span id="qt">$0</span></h2><textarea id="qnote" placeholder="報價說明"></textarea><button class="btn np" onclick="window.print()">列印／存 PDF</button></div></section></div>
<nav class="np"><button onclick="go('home')">工作台</button><button onclick="go('jobs')">案件</button><button onclick="fresh()">＋新增</button><button onclick="go('cal')">日程</button><button onclick="go('quote')">報價</button></nav>
<script>
const K='eng_v2',E=x=>document.getElementById(x),M=n=>'$'+Number(n||0).toLocaleString(),T=j=>(+j.mat||0)+(+j.labor||0)+(+j.other||0);let J=JSON.parse(localStorage.getItem(K)||'[]');
function go(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));E(x).classList.add('on');if(x==='home')home();if(x==='jobs')list();if(x==='cal')calendar()}
function fresh(){['id','client','phone','addr','warranty','note'].forEach(x=>E(x).value='');['cost','mat','labor','other','paid'].forEach(x=>E(x).value=0);E('date').value=new Date().toISOString().slice(0,10);E('et').textContent='新增工程';E('del').style.display='none';go('edit')}
function files(fs){return Promise.all([...fs].slice(0,6).map(f=>new Promise(r=>{let q=new FileReader;q.onload=()=>r(q.result);q.readAsDataURL(f)})))}
async function save(){if(!E('client').value.trim())return alert('請輸入客戶姓名');let id=+E('id').value||Date.now(),old=J.find(x=>x.id===id),p=await files(E('pics').files),j={id,client:E('client').value,phone:E('phone').value,type:E('type').value,addr:E('addr').value,date:E('date').value,status:E('status').value,cost:+E('cost').value||0,mat:+E('mat').value||0,labor:+E('labor').value||0,other:+E('other').value||0,paid:+E('paid').value||0,warranty:E('warranty').value,note:E('note').value,photos:[...(old?.photos||[]),...p].slice(0,6)};J=J.filter(x=>x.id!==id);J.unshift(j);try{localStorage.setItem(K,JSON.stringify(J))}catch(e){alert('照片容量過大，請減少照片');return}go('jobs')}
function card(j){return `<div class="card item" onclick="openJ(${j.id})"><div><b>${j.client}｜${j.type}</b><div class="muted">${j.date||'未排日期'} · ${j.addr||'未填地址'}<br>總額 ${M(T(j))}｜待收 ${M(Math.max(0,T(j)-j.paid))}</div></div><span class="badge">${j.status}</span></div>`}
function home(){let ym=new Date().toISOString().slice(0,7),m=J.filter(j=>(j.date||'').startsWith(ym));E('a').textContent=J.filter(j=>j.status!=='已完工').length;E('d').textContent=M(J.reduce((s,j)=>s+Math.max(0,T(j)-j.paid),0));E('r').textContent=M(m.reduce((s,j)=>s+j.paid,0));E('g').textContent=M(m.reduce((s,j)=>s+T(j)-j.cost,0));E('recent').innerHTML=J.length?J.slice(0,5).map(card).join(''):'<div class="card muted">尚無案件</div>'}
function list(){let q=E('search').value.toLowerCase(),a=J.filter(j=>[j.client,j.phone,j.addr,j.type].join(' ').toLowerCase().includes(q));E('list').innerHTML=a.length?a.map(card).join(''):'<div class="card muted">沒有符合案件</div>'}
function openJ(id){let j=J.find(x=>x.id===id);for(let k of ['client','phone','type','date','status','cost','labor','other','paid','warranty','note'])E(k).value=j[k]??'';E('addr').value=j.addr||'';E('mat').value=j.mat||0;E('id').value=id;E('et').textContent='編輯工程';E('del').style.display='inline-block';go('edit')}
function removeJob(){let id=+E('id').value;if(confirm('確定刪除此案件？')){J=J.filter(x=>x.id!==id);localStorage.setItem(K,JSON.stringify(J));go('jobs')}}
function calendar(){let a=[...J].filter(j=>j.date).sort((x,y)=>x.date.localeCompare(y.date));E('calList').innerHTML=a.length?a.map(card).join(''):'<div class="card muted">尚無排程</div>'}
function cq(){E('qt').textContent=M((+E('qm').value||0)+(+E('ql').value||0)+(+E('qo').value||0))}
home();cq();
</script></body></html>
