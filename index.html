<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程管家 V5</title><style>
body{font-family:-apple-system,"PingFang TC",sans-serif;background:#f5f1eb;color:#28241f;margin:0}.app{max-width:850px;margin:auto;padding:18px 14px 90px}.card{background:white;border:1px solid #e3dbd0;border-radius:17px;padding:15px;margin:9px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.muted{font-size:12px;color:#756e64}.btn{border:0;border-radius:12px;padding:11px;background:#705a48;color:white;font-weight:700}.alt{background:#eee5da;color:#28241f}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:11px;margin:5px 0 10px;font:inherit}.page{display:none}.page.on{display:block}.item{display:flex;justify-content:space-between;gap:10px}.badge{background:#eee5da;padding:5px 8px;border-radius:99px;font-size:11px;height:max-content}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:center;gap:15px;padding:12px}nav button{border:0;background:none}.stat b{display:block;font-size:21px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:480px){.row{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="app"><h1>工程管家 <span class="badge">V5</span></h1><div class="card"><input id="co" placeholder="公司名稱"><input id="un" placeholder="使用者名稱"><select id="ro"><option value="owner">老闆</option><option value="admin">行政</option><option value="worker">師傅</option></select><input id="pw" type="password" placeholder="測試密碼"><button class="btn" onclick="login()">登入／建立測試帳號</button><p class="muted">此版本可測試多人角色流程；正式雲端連線請依 README 設定 Supabase。</p></div></div>
<div id="main" class="app" style="display:none"><h1>工程管家 <span class="badge">V5 多人版</span></h1><p id="who" class="muted"></p>
<section id="home" class="page on"><div class="grid"><div class="card stat"><span class="muted">進行中</span><b id="a">0</b></div><div class="card stat"><span class="muted">待收款</span><b id="d">$0</b></div></div><button class="btn write" onclick="fresh()">＋新增工程</button><h2>近期案件</h2><div id="recent"></div></section>
<section id="jobs" class="page"><h2>工程案件</h2><input id="search" placeholder="搜尋" oninput="list()"><div id="jl"></div></section>
<section id="edit" class="page"><h2>工程資料</h2><div class="card"><input id="id" type="hidden"><input id="client" placeholder="客戶"><div class="row"><input id="phone" placeholder="電話"><select id="type"><option>冷氣安裝</option><option>冷氣維修</option><option>水電工程</option><option>弱電工程</option><option>居家修繕</option><option>裝潢工程</option><option>其他</option></select></div><input id="addr" placeholder="施工地址"><div class="row"><input id="date" type="date"><input id="worker" placeholder="負責師傅"></div><select id="status"><option>新詢問</option><option>現勘</option><option>待報價</option><option>已報價</option><option>已收訂金</option><option>已排程</option><option>施工中</option><option>待驗收</option><option>待尾款</option><option>已完工</option></select><div class="row money"><input id="amount" type="number" placeholder="工程總額"><input id="paid" type="number" placeholder="已收款"></div><textarea id="note" placeholder="施工紀錄"></textarea><input id="pics" type="file" accept="image/*" multiple><button class="btn" onclick="save()">儲存</button></div></section>
<section id="team" class="page"><h2>團隊</h2><div class="card owner"><input id="tn" placeholder="成員名稱"><select id="tr"><option value="admin">行政</option><option value="worker">師傅</option></select><button class="btn" onclick="addTeam()">新增成員</button></div><div id="tl"></div></section>
<section id="cloud" class="page"><h2>雲端設定</h2><div class="card"><b>Supabase</b><p class="muted">正式版請使用自己的 Project URL 與 publishable/anon key。不要使用 service_role key。</p><input id="url" placeholder="Project URL"><input id="key" placeholder="Publishable / anon key"><button class="btn" onclick="alert('設定欄位已預留；請依 README 完成 Auth、Database、Storage 與 RLS。')">儲存設定</button></div></section></div>
<nav id="nav" style="display:none"><button onclick="go('home')">工作台</button><button onclick="go('jobs')">案件</button><button class="write" onclick="fresh()">＋新增</button><button onclick="go('team')">團隊</button><button onclick="go('cloud')">雲端</button><button onclick="logout()">登出</button></nav>
<script>
const $=x=>document.getElementById(x),M=n=>'$'+Number(n||0).toLocaleString();let U=null,J=[],T=[];
function k(x){return 'v5_'+U.co+'_'+x}function login(){if(!$('co').value||!$('un').value||!$('pw').value)return alert('請完整輸入');U={co:$('co').value,un:$('un').value,ro:$('ro').value};localStorage.setItem('v5s',JSON.stringify(U));boot()}function logout(){localStorage.removeItem('v5s');location.reload()}
function boot(){J=JSON.parse(localStorage.getItem(k('j'))||'[]');T=JSON.parse(localStorage.getItem(k('t'))||'[]');$('login').style.display='none';$('main').style.display='block';$('nav').style.display='flex';$('who').textContent=U.co+'｜'+U.un+'｜'+({owner:'老闆',admin:'行政',worker:'師傅'}[U.ro]);document.querySelectorAll('.owner').forEach(x=>x.style.display=U.ro==='owner'?'':'none');document.querySelectorAll('.write').forEach(x=>x.style.display=U.ro==='worker'?'none':'');document.querySelectorAll('.money').forEach(x=>x.style.display=U.ro==='worker'?'none':'');home()}
function p(){localStorage.setItem(k('j'),JSON.stringify(J));localStorage.setItem(k('t'),JSON.stringify(T))}function vis(){return U.ro==='worker'?J.filter(j=>j.worker===U.un):J}function go(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));$(x).classList.add('on');if(x==='home')home();if(x==='jobs')list();if(x==='team')team()}
function card(j){return `<div class="card item" onclick="edit(${j.id})"><div><b>${j.client}｜${j.type}</b><div class="muted">${j.date||'未排日期'} · ${j.worker||'未指定'}<br>${j.addr||''}</div></div><span class="badge">${j.status}</span></div>`}function home(){let v=vis();$('a').textContent=v.filter(j=>j.status!=='已完工').length;$('d').textContent=U.ro==='worker'?'—':M(v.reduce((s,j)=>s+Math.max(0,j.amount-j.paid),0));$('recent').innerHTML=v.length?v.slice(0,5).map(card).join(''):'<div class="card muted">尚無案件</div>'}
function fresh(){if(U.ro==='worker')return;['id','client','phone','addr','worker','note'].forEach(x=>$(x).value='');['amount','paid'].forEach(x=>$(x).value=0);$('date').value=new Date().toISOString().slice(0,10);go('edit')}function save(){let id=+$('id').value||Date.now(),old=J.find(x=>x.id===id);if(U.ro==='worker'&&!old)return;let j={id,client:$('client').value,phone:$('phone').value,type:$('type').value,addr:$('addr').value,date:$('date').value,worker:$('worker').value,status:$('status').value,amount:U.ro==='worker'?(old?.amount||0):+$('amount').value||0,paid:U.ro==='worker'?(old?.paid||0):+$('paid').value||0,note:$('note').value};J=J.filter(x=>x.id!==id);J.unshift(j);p();go('jobs')}function edit(id){let j=J.find(x=>x.id===id);if(U.ro==='worker'&&j.worker!==U.un)return;['client','phone','type','addr','date','worker','status','amount','paid','note'].forEach(x=>$(x).value=j[x]??'');$('id').value=id;go('edit')}function list(){let q=$('search').value.toLowerCase(),v=vis().filter(j=>[j.client,j.phone,j.addr,j.worker,j.type].join(' ').toLowerCase().includes(q));$('jl').innerHTML=v.length?v.map(card).join(''):'<div class="card muted">沒有符合案件</div>'}
function addTeam(){if(U.ro!=='owner')return;let n=$('tn').value;if(!n)return;T.push({name:n,role:$('tr').value});$('tn').value='';p();team()}function team(){$('tl').innerHTML=T.length?T.map(t=>`<div class="card item"><b>${t.name}</b><span class="badge">${t.role==='admin'?'行政':'師傅'}</span></div>`).join(''):'<div class="card muted">尚無成員</div>'}
U=JSON.parse(localStorage.getItem('v5s')||'null');if(U)boot();
</script></body></html>
