<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8dfd3"><title>工程管家 V3</title>
<style>
:root{--bg:#f5f1eb;--card:#fff;--ink:#28241f;--muted:#766f65;--line:#e4ddd3;--accent:#705a48;--soft:#eee5da;--bad:#944b43;--ok:#55715e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:820px;margin:auto;padding:16px 14px 98px}.page{display:none}.page.on{display:block}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:23px;font-weight:850}.muted{font-size:12px;color:var(--muted)}.badge{font-size:11px;background:var(--soft);border-radius:999px;padding:5px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:9px 0;box-shadow:0 3px 14px #4536270b}.stat b{display:block;font-size:21px;margin-top:5px}
h2{font-size:17px;margin:20px 2px 9px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit;margin:5px 0 10px}textarea{min-height:76px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 12px;background:var(--accent);color:#fff;font-weight:750}.btn.alt{background:var(--soft);color:var(--ink)}.btn.bad{background:#f1dfdd;color:var(--bad)}.full{width:100%}.actions{display:flex;gap:8px;margin:10px 0}.actions>*{flex:1}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.meta{font-size:12px;color:var(--muted);margin-top:4px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.empty{text-align:center;color:var(--muted);padding:26px}
.material{display:grid;grid-template-columns:1.6fr .7fr .9fr auto;gap:6px;align-items:center}.material input{margin:2px 0}.total{font-size:22px;font-weight:850}
nav{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:9}nav .wrap{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{border:0;background:none;color:var(--muted);font-size:11px;padding:7px 2px}nav button.active{color:var(--accent);font-weight:800}
#login{max-width:440px;margin:55px auto}.logo{text-align:center;font-size:28px;font-weight:900;margin-bottom:6px}
@media(max-width:480px){.row{grid-template-columns:1fr}.material{grid-template-columns:1.3fr .55fr .8fr auto}}@media print{nav,.np,header{display:none!important}.app{padding:0}.page{display:none!important}#quote{display:block!important}.card{box-shadow:none}}
</style></head><body>
<div id="login" class="app"><div class="logo">工程管家</div><div class="muted" style="text-align:center">V3 · 工程案件與報價管理</div><div class="card"><label>帳號名稱</label><input id="loginName" placeholder="例：佑聖工程"><label>密碼</label><input id="loginPass" type="password" placeholder="請輸入密碼"><button class="btn full" onclick="login()">登入／建立本機帳號</button><p class="muted">此下載版可直接測試。正式雲端登入已預留 Supabase 設定位置，請參考 README。</p></div></div>
<div id="main" class="app" style="display:none"><header><div><div class="brand">工程管家 <span class="badge">V3</span></div><div class="muted" id="hello"></div></div><button class="btn alt np" onclick="logout()">登出</button></header>
<section id="home" class="page on"><div class="grid"><div class="card stat"><span class="muted">進行中</span><b id="stA">0</b></div><div class="card stat"><span class="muted">待收款</span><b id="stD">$0</b></div><div class="card stat"><span class="muted">本月已收</span><b id="stR">$0</b></div><div class="card stat"><span class="muted">預估毛利</span><b id="stG">$0</b></div></div><div class="actions np"><button class="btn" onclick="fresh()">＋新增工程</button><button class="btn alt" onclick="go('materials')">材料庫</button></div><h2>近期案件</h2><div id="recent"></div></section>
<section id="jobs" class="page"><h2>案件管理</h2><input id="search" placeholder="搜尋姓名／電話／地址／工程" oninput="renderJobs()"><div id="jobList"></div></section>
<section id="edit" class="page"><h2 id="editTitle">新增工程</h2><div class="card"><input id="eid" type="hidden"><label>客戶姓名</label><input id="client"><div class="row"><div><label>電話</label><input id="phone"></div><div><label>工程類型</label><select id="type"><option>冷氣安裝</option><option>冷氣維修</option><option>水電工程</option><option>弱電工程</option><option>居家修繕</option><option>裝潢工程</option><option>其他</option></select></div></div><label>施工地址</label><input id="addr"><div class="row"><div><label>施工日期</label><input id="date" type="date"></div><div><label>狀態</label><select id="status"><option>待報價</option><option>已報價</option><option>已預約</option><option>施工中</option><option>已完工</option></select></div></div><div class="row"><div><label>材料成本</label><input id="cost" type="number" value="0"></div><div><label>材料報價</label><input id="mat" type="number" value="0"></div></div><div class="row"><div><label>工資</label><input id="labor" type="number" value="0"></div><div><label>其他費用</label><input id="other" type="number" value="0"></div></div><div class="row"><div><label>已收款</label><input id="paid" type="number" value="0"></div><div><label>保固至</label><input id="warranty" type="date"></div></div><label>施工備註</label><textarea id="note"></textarea><label>施工照片（最多 6 張；正式雲端版可改 Storage）</label><input id="pics" type="file" accept="image/*" multiple><div class="actions"><button class="btn" onclick="saveJob()">儲存</button><button class="btn bad" id="deleteBtn" style="display:none" onclick="removeJob()">刪除</button></div></div></section>
<section id="materials" class="page"><h2>材料庫</h2><div class="card"><div class="material"><input id="mn" placeholder="材料名稱"><input id="mq" type="number" value="1" min="0"><input id="mp" type="number" value="0" min="0" placeholder="成本"><button class="btn" onclick="addMaterial()">＋</button></div></div><div id="materialList"></div></section>
<section id="quote" class="page"><h2>正式報價單</h2><div class="card"><label>公司／工程行</label><input id="qCompany"><label>客戶／工程</label><input id="qName"><div class="row"><div><label>材料</label><input id="qM" type="number" value="0" oninput="calcQ()"></div><div><label>工資</label><input id="qL" type="number" value="0" oninput="calcQ()"></div></div><label>其他</label><input id="qO" type="number" value="0" oninput="calcQ()"><p class="total">報價總額 <span id="qT">$0</span></p><label>報價說明／付款條件</label><textarea id="qNote" placeholder="例：報價有效 7 日；訂金 50%；完工收尾款。"></textarea><div class="actions np"><button class="btn alt" onclick="window.print()">列印／存 PDF</button><button class="btn" onclick="copyQuote()">複製報價文字</button></div></div></section>
</div>
<nav id="nav" class="np" style="display:none"><div class="wrap"><button data-p="home" class="active" onclick="go('home')">⌂<br>工作台</button><button data-p="jobs" onclick="go('jobs')">▤<br>案件</button><button data-p="edit" onclick="fresh()">＋<br>新增</button><button data-p="materials" onclick="go('materials')">◇<br>材料</button><button data-p="quote" onclick="go('quote')">$<br>報價</button></div></nav>
<script>
const $=x=>document.getElementById(x),M=n=>'$'+Number(n||0).toLocaleString('zh-TW'),T=j=>(+j.mat||0)+(+j.labor||0)+(+j.other||0);
let user=localStorage.getItem('eng_v3_user')||'',J=[],MAT=[];
function keys(){return {j:'eng_v3_jobs_'+user,m:'eng_v3_materials_'+user}}
function load(){let k=keys();J=JSON.parse(localStorage.getItem(k.j)||'[]');MAT=JSON.parse(localStorage.getItem(k.m)||'[]')}
function persist(){let k=keys();localStorage.setItem(k.j,JSON.stringify(J));localStorage.setItem(k.m,JSON.stringify(MAT))}
function login(){let n=$('loginName').value.trim(),p=$('loginPass').value;if(!n||!p)return alert('請輸入帳號名稱與密碼');let ph=btoa(unescape(encodeURIComponent(p))).slice(0,24),stored=localStorage.getItem('eng_v3_pass_'+n);if(stored&&stored!==ph)return alert('密碼錯誤');localStorage.setItem('eng_v3_pass_'+n,ph);user=n;localStorage.setItem('eng_v3_user',n);boot()}
function logout(){localStorage.removeItem('eng_v3_user');location.reload()}
function boot(){load();$('login').style.display='none';$('main').style.display='block';$('nav').style.display='block';$('hello').textContent=user+'｜'+new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium'}).format(new Date());$('qCompany').value=user;home()}
if(user)boot();
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(p).classList.add('on');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));if(p==='home')home();if(p==='jobs')renderJobs();if(p==='materials')renderMaterials();scrollTo(0,0)}
function fresh(){['eid','client','phone','addr','warranty','note'].forEach(x=>$(x).value='');['cost','mat','labor','other','paid'].forEach(x=>$(x).value=0);$('date').value=new Date().toISOString().slice(0,10);$('status').value='待報價';$('editTitle').textContent='新增工程';$('deleteBtn').style.display='none';go('edit')}
function readFiles(fs){return Promise.all([...fs].slice(0,6).map(f=>new Promise(r=>{let q=new FileReader;q.onload=()=>r(q.result);q.readAsDataURL(f)})))}
async function saveJob(){if(!$('client').value.trim())return alert('請輸入客戶姓名');let id=+$('eid').value||Date.now(),old=J.find(x=>x.id===id),pics=await readFiles($('pics').files);let j={id,client:$('client').value.trim(),phone:$('phone').value.trim(),type:$('type').value,addr:$('addr').value.trim(),date:$('date').value,status:$('status').value,cost:+$('cost').value||0,mat:+$('mat').value||0,labor:+$('labor').value||0,other:+$('other').value||0,paid:+$('paid').value||0,warranty:$('warranty').value,note:$('note').value.trim(),photos:[...(old?.photos||[]),...pics].slice(0,6)};J=J.filter(x=>x.id!==id);J.unshift(j);try{persist()}catch(e){alert('照片容量過大，請減少照片再儲存');return}go('jobs')}
function card(j){return `<div class="card item" onclick="editJob(${j.id})"><div><b>${j.client}｜${j.type}</b><div class="meta">${j.date||'未排日期'} · ${j.addr||'未填地址'}<br>總額 ${M(T(j))}｜待收 ${M(Math.max(0,T(j)-j.paid))}</div></div><span class="badge">${j.status}</span></div>`}
function home(){let ym=new Date().toISOString().slice(0,7),a=J.filter(j=>(j.date||'').startsWith(ym));$('stA').textContent=J.filter(j=>j.status!=='已完工').length;$('stD').textContent=M(J.reduce((s,j)=>s+Math.max(0,T(j)-j.paid),0));$('stR').textContent=M(a.reduce((s,j)=>s+j.paid,0));$('stG').textContent=M(a.reduce((s,j)=>s+T(j)-j.cost,0));$('recent').innerHTML=J.length?J.slice(0,5).map(card).join(''):'<div class="card empty">還沒有工程案件</div>'}
function renderJobs(){let q=$('search').value.toLowerCase(),a=J.filter(j=>[j.client,j.phone,j.addr,j.type].join(' ').toLowerCase().includes(q));$('jobList').innerHTML=a.length?a.map(card).join(''):'<div class="card empty">沒有符合案件</div>'}
function editJob(id){let j=J.find(x=>x.id===id);['client','phone','type','date','status','cost','labor','other','paid','warranty','note'].forEach(k=>$(k).value=j[k]??'');$('addr').value=j.addr||'';$('mat').value=j.mat||0;$('eid').value=id;$('editTitle').textContent='編輯工程';$('deleteBtn').style.display='block';go('edit')}
function removeJob(){let id=+$('eid').value;if(confirm('確定刪除此案件？')){J=J.filter(x=>x.id!==id);persist();go('jobs')}}
function addMaterial(){let n=$('mn').value.trim();if(!n)return;MAT.unshift({id:Date.now(),name:n,qty:+$('mq').value||0,cost:+$('mp').value||0});$('mn').value='';persist();renderMaterials()}
function renderMaterials(){$('materialList').innerHTML=MAT.length?MAT.map(m=>`<div class="card item"><div><b>${m.name}</b><div class="meta">庫存 ${m.qty}｜單位成本 ${M(m.cost)}｜庫存成本 ${M(m.qty*m.cost)}</div></div><button class="btn bad" onclick="delMat(${m.id})">刪除</button></div>`).join(''):'<div class="card empty">尚未建立材料</div>'}
function delMat(id){MAT=MAT.filter(x=>x.id!==id);persist();renderMaterials()}
function calcQ(){$('qT').textContent=M((+$('qM').value||0)+(+$('qL').value||0)+(+$('qO').value||0))}
async function copyQuote(){let t=`${$('qCompany').value}\\n工程報價｜${$('qName').value}\\n材料：${M($('qM').value)}\\n工資：${M($('qL').value)}\\n其他：${M($('qO').value)}\\n總額：${$('qT').textContent}\\n${$('qNote').value}`;try{await navigator.clipboard.writeText(t);alert('已複製')}catch(e){prompt('請複製以下內容',t)}}
calcQ();
</script></body></html>
