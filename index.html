<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8dfd3"><title>工程管家 V4</title>
<style>
:root{--bg:#f5f1eb;--card:#fff;--ink:#28241f;--muted:#756e64;--line:#e3dbd0;--accent:#705a48;--soft:#eee5da;--bad:#934b43;--ok:#56715e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:900px;margin:auto;padding:16px 14px 102px}.page{display:none}.page.on{display:block}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:23px;font-weight:900}.muted,.meta{font-size:12px;color:var(--muted)}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:9px 0;box-shadow:0 3px 14px #4536270b}.stat b{font-size:21px;display:block;margin-top:5px}
h2{font-size:17px;margin:20px 2px 9px}h3{font-size:14px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit;margin:5px 0 10px}textarea{min-height:72px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 12px;background:var(--accent);color:#fff;font-weight:750}.btn.alt{background:var(--soft);color:var(--ink)}.btn.bad{background:#f2dfdd;color:var(--bad)}.full{width:100%}.actions{display:flex;gap:8px;margin:10px 0}.actions>*{flex:1}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.money{font-variant-numeric:tabular-nums}.empty{text-align:center;padding:26px;color:var(--muted)}
.pipeline{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.pipe{min-width:115px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px}.pipe b{font-size:20px;display:block}.today{border-left:4px solid var(--accent)}.lineitem{display:grid;grid-template-columns:1.5fr .5fr .7fr auto;gap:6px;align-items:center}.lineitem input{margin:2px 0}.quote-total{font-size:24px;font-weight:900}.pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.progress i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:9}nav .wrap{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}nav button{border:0;background:none;color:var(--muted);font-size:10px;padding:7px 1px}nav button.active{color:var(--accent);font-weight:850}
@media(max-width:500px){.row,.pay{grid-template-columns:1fr}.lineitem{grid-template-columns:1.3fr .5fr .7fr auto}}@media print{nav,.np,header{display:none!important}.app{padding:0}.page{display:none!important}#quote{display:block!important}.card{box-shadow:none}}
</style></head><body><div class="app">
<header><div><div class="brand">工程管家 <span class="badge">V4 營運版</span></div><div class="muted" id="dateNow"></div></div><button class="btn alt np" onclick="backup()">備份資料</button></header>

<section id="home" class="page on">
<div class="grid"><div class="card stat"><span class="muted">進行中</span><b id="sActive">0</b></div><div class="card stat"><span class="muted">待收款</span><b id="sDue">$0</b></div><div class="card stat"><span class="muted">本月營收</span><b id="sRev">$0</b></div><div class="card stat"><span class="muted">預估毛利</span><b id="sProfit">$0</b></div></div>
<h2>工程流程</h2><div class="pipeline" id="pipeline"></div>
<div class="actions np"><button class="btn" onclick="fresh()">＋新增工程</button><button class="btn alt" onclick="go('today')">今日工地</button></div>
<h2>近期案件</h2><div id="recent"></div></section>

<section id="today" class="page"><h2>今日工地</h2><div id="todayList"></div></section>
<section id="clients" class="page"><h2>客戶 CRM</h2><input id="clientSearch" placeholder="搜尋客戶／電話／地址" oninput="renderClients()"><div id="clientList"></div></section>
<section id="jobs" class="page"><h2>工程案件</h2><input id="jobSearch" placeholder="搜尋姓名／電話／工程／地址" oninput="renderJobs()"><div id="jobList"></div></section>

<section id="edit" class="page"><h2 id="editTitle">新增工程</h2><div class="card">
<input id="eid" type="hidden"><label>客戶姓名</label><input id="client"><div class="row"><div><label>電話</label><input id="phone"></div><div><label>LINE／其他聯絡</label><input id="line"></div></div>
<label>施工地址</label><input id="addr"><div class="row"><div><label>工程類型</label><select id="type"><option>冷氣安裝</option><option>冷氣維修</option><option>水電工程</option><option>弱電工程</option><option>居家修繕</option><option>裝潢工程</option><option>其他</option></select></div><div><label>工程流程</label><select id="status"><option>新詢問</option><option>現勘</option><option>待報價</option><option>已報價</option><option>已收訂金</option><option>已排程</option><option>施工中</option><option>待驗收</option><option>待尾款</option><option>已完工</option></select></div></div>
<div class="row"><div><label>施工日期</label><input id="date" type="date"></div><div><label>負責師傅</label><input id="worker" placeholder="例：阿豪"></div></div>
<div class="row"><div><label>工程總額</label><input id="amount" type="number" value="0"></div><div><label>預估成本</label><input id="cost" type="number" value="0"></div></div>
<h3>分期收款</h3><div class="pay"><div><label>訂金</label><input id="deposit" type="number" value="0"></div><div><label>二期款</label><input id="second" type="number" value="0"></div><div><label>尾款</label><input id="finalpay" type="number" value="0"></div></div>
<div class="row"><div><label>保固至</label><input id="warranty" type="date"></div><div><label>最後收款日</label><input id="paydate" type="date"></div></div>
<label>施工紀錄／備註</label><textarea id="note"></textarea><label>施工照片（最多 6 張）</label><input id="pics" type="file" accept="image/*" multiple>
<div class="actions"><button class="btn" onclick="saveJob()">儲存工程</button><button id="deleteBtn" class="btn bad" style="display:none" onclick="removeJob()">刪除</button></div></div></section>

<section id="quote" class="page"><h2>詳細報價單</h2><div class="card"><div class="row"><div><label>報價單號</label><input id="qNo" readonly></div><div><label>報價日期</label><input id="qDate" type="date"></div></div><label>客戶／工程</label><input id="qName"><div id="qItems"></div><button class="btn alt np" onclick="addQItem()">＋新增品項</button><div class="row"><div><label>其他費用</label><input id="qOther" type="number" value="0" oninput="calcQuote()"></div><div><label>折扣</label><input id="qDiscount" type="number" value="0" oninput="calcQuote()"></div></div><p class="quote-total">總報價 <span id="qTotal">$0</span></p><label>付款條件／備註</label><textarea id="qNote">報價有效 7 日；訂金 50%，完工後支付尾款。</textarea><div class="actions np"><button class="btn alt" onclick="window.print()">列印／存 PDF</button><button class="btn" onclick="copyQuote()">複製報價</button></div></div></section>

<section id="analytics" class="page"><h2>老闆數據中心</h2><div class="grid"><div class="card stat"><span class="muted">累積工程額</span><b id="anTotal">$0</b></div><div class="card stat"><span class="muted">累積已收</span><b id="anPaid">$0</b></div><div class="card stat"><span class="muted">累積待收</span><b id="anDue">$0</b></div><div class="card stat"><span class="muted">預估總毛利</span><b id="anProfit">$0</b></div></div><h2>工程類型</h2><div id="typeStats"></div><h2>負責師傅</h2><div id="workerStats"></div></section>
</div>
<nav class="np"><div class="wrap"><button data-p="home" class="active" onclick="go('home')">⌂<br>工作台</button><button data-p="today" onclick="go('today')">☷<br>今日</button><button data-p="clients" onclick="go('clients')">♙<br>客戶</button><button data-p="jobs" onclick="go('jobs')">▤<br>案件</button><button data-p="quote" onclick="go('quote')">$<br>報價</button><button data-p="analytics" onclick="go('analytics')">▥<br>數據</button></div></nav>
<script>
const K='engineering_v4_jobs',QK='engineering_v4_quote_seq',$=x=>document.getElementById(x),M=n=>'$'+Number(n||0).toLocaleString('zh-TW'),paid=j=>(+j.deposit||0)+(+j.second||0)+(+j.finalpay||0);
let J=JSON.parse(localStorage.getItem(K)||'[]'), qitems=[];
$('dateNow').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full'}).format(new Date());
function persist(){localStorage.setItem(K,JSON.stringify(J))}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(p).classList.add('on');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));if(p==='home')home();if(p==='today')renderToday();if(p==='clients')renderClients();if(p==='jobs')renderJobs();if(p==='analytics')analytics();if(p==='quote'&&!qitems.length)initQuote();scrollTo(0,0)}
function card(j){let d=Math.max(0,j.amount-paid(j)),pct=j.amount?Math.min(100,paid(j)/j.amount*100):0;return `<div class="card item" onclick="editJob(${j.id})"><div style="flex:1"><b>${j.client}｜${j.type}</b><div class="meta">${j.date||'未排日期'} · ${j.worker||'未指定師傅'}<br>${j.addr||'未填地址'} · 待收 ${M(d)}</div><div class="progress"><i style="width:${pct}%"></i></div></div><span class="badge">${j.status}</span></div>`}
function home(){let ym=new Date().toISOString().slice(0,7),m=J.filter(j=>(j.date||'').startsWith(ym));$('sActive').textContent=J.filter(j=>j.status!=='已完工').length;$('sDue').textContent=M(J.reduce((s,j)=>s+Math.max(0,j.amount-paid(j)),0));$('sRev').textContent=M(m.reduce((s,j)=>s+paid(j),0));$('sProfit').textContent=M(m.reduce((s,j)=>s+j.amount-j.cost,0));let stages=['新詢問','現勘','待報價','已報價','已收訂金','已排程','施工中','待驗收','待尾款','已完工'];$('pipeline').innerHTML=stages.map(s=>`<div class="pipe"><span class="muted">${s}</span><b>${J.filter(j=>j.status===s).length}</b></div>`).join('');$('recent').innerHTML=J.length?J.slice(0,5).map(card).join(''):'<div class="card empty">尚無案件</div>'}
function fresh(){['eid','client','phone','line','addr','worker','warranty','paydate','note'].forEach(x=>$(x).value='');['amount','cost','deposit','second','finalpay'].forEach(x=>$(x).value=0);$('date').value=new Date().toISOString().slice(0,10);$('status').value='新詢問';$('editTitle').textContent='新增工程';$('deleteBtn').style.display='none';go('edit')}
function readFiles(fs){return Promise.all([...fs].slice(0,6).map(f=>new Promise(r=>{let q=new FileReader;q.onload=()=>r(q.result);q.readAsDataURL(f)})))}
async function saveJob(){if(!$('client').value.trim())return alert('請輸入客戶姓名');let id=+$('eid').value||Date.now(),old=J.find(x=>x.id===id),pics=await readFiles($('pics').files),j={id,client:$('client').value.trim(),phone:$('phone').value.trim(),line:$('line').value.trim(),addr:$('addr').value.trim(),type:$('type').value,status:$('status').value,date:$('date').value,worker:$('worker').value.trim(),amount:+$('amount').value||0,cost:+$('cost').value||0,deposit:+$('deposit').value||0,second:+$('second').value||0,finalpay:+$('finalpay').value||0,warranty:$('warranty').value,paydate:$('paydate').value,note:$('note').value.trim(),photos:[...(old?.photos||[]),...pics].slice(0,6)};J=J.filter(x=>x.id!==id);J.unshift(j);try{persist()}catch(e){alert('照片容量過大，請減少照片');return}go('jobs')}
function editJob(id){let j=J.find(x=>x.id===id);['client','phone','line','addr','type','status','date','worker','amount','cost','deposit','second','finalpay','warranty','paydate','note'].forEach(k=>$(k).value=j[k]??'');$('eid').value=id;$('editTitle').textContent='編輯工程';$('deleteBtn').style.display='block';go('edit')}
function removeJob(){let id=+$('eid').value;if(confirm('確定刪除此案件？')){J=J.filter(x=>x.id!==id);persist();go('jobs')}}
function renderJobs(){let q=$('jobSearch').value.toLowerCase(),a=J.filter(j=>[j.client,j.phone,j.addr,j.type,j.worker].join(' ').toLowerCase().includes(q));$('jobList').innerHTML=a.length?a.map(card).join(''):'<div class="card empty">沒有符合案件</div>'}
function renderToday(){let d=new Date().toISOString().slice(0,10),a=J.filter(j=>j.date===d);$('todayList').innerHTML=a.length?a.map(j=>`<div class="card today"><b>${j.client}｜${j.type}</b><div class="meta">${j.addr}<br>負責：${j.worker||'未指定'}｜${j.status}</div><div class="actions np"><a class="btn alt" style="text-decoration:none;text-align:center" href="tel:${j.phone}">撥電話</a><button class="btn" onclick="editJob(${j.id})">施工紀錄</button></div></div>`).join(''):'<div class="card empty">今天沒有排定工程</div>'}
function renderClients(){let q=$('clientSearch').value.toLowerCase(),map={};J.forEach(j=>{let k=j.phone||j.client;if(!map[k])map[k]={name:j.client,phone:j.phone,addr:j.addr,n:0,total:0,due:0};map[k].n++;map[k].total+=j.amount;map[k].due+=Math.max(0,j.amount-paid(j))});let a=Object.values(map).filter(c=>[c.name,c.phone,c.addr].join(' ').toLowerCase().includes(q));$('clientList').innerHTML=a.length?a.map(c=>`<div class="card item"><div><b>${c.name}</b><div class="meta">${c.phone||'未填電話'} · ${c.n} 件工程<br>${c.addr||''}</div></div><div style="text-align:right"><b>${M(c.total)}</b><div class="meta">待收 ${M(c.due)}</div></div></div>`).join(''):'<div class="card empty">尚無客戶</div>'}
function initQuote(){qitems=[{name:'材料／施工項目',qty:1,price:0}];let seq=+(localStorage.getItem(QK)||0)+1;localStorage.setItem(QK,seq);$('qNo').value='Q'+new Date().toISOString().slice(0,7).replace('-','')+'-'+String(seq).padStart(3,'0');$('qDate').value=new Date().toISOString().slice(0,10);renderQ()}
function addQItem(){qitems.push({name:'',qty:1,price:0});renderQ()}
function renderQ(){$('qItems').innerHTML=qitems.map((x,i)=>`<div class="lineitem"><input value="${x.name}" oninput="qitems[${i}].name=this.value"><input type="number" value="${x.qty}" oninput="qitems[${i}].qty=+this.value;calcQuote()"><input type="number" value="${x.price}" oninput="qitems[${i}].price=+this.value;calcQuote()"><button class="btn bad np" onclick="qitems.splice(${i},1);renderQ()">×</button></div>`).join('');calcQuote()}
function calcQuote(){let n=qitems.reduce((s,x)=>s+(+x.qty||0)*(+x.price||0),0)+(+$('qOther').value||0)-(+$('qDiscount').value||0);$('qTotal').textContent=M(Math.max(0,n))}
async function copyQuote(){let lines=qitems.map(x=>`${x.name} × ${x.qty}｜${M(x.qty*x.price)}`).join('\n'),t=`報價單 ${$('qNo').value}\n${$('qName').value}\n${lines}\n其他：${M($('qOther').value)}\n折扣：${M($('qDiscount').value)}\n總額：${$('qTotal').textContent}\n${$('qNote').value}`;try{await navigator.clipboard.writeText(t);alert('報價內容已複製')}catch(e){prompt('請複製',t)}}
function analytics(){let tot=J.reduce((s,j)=>s+j.amount,0),pd=J.reduce((s,j)=>s+paid(j),0);$('anTotal').textContent=M(tot);$('anPaid').textContent=M(pd);$('anDue').textContent=M(Math.max(0,tot-pd));$('anProfit').textContent=M(J.reduce((s,j)=>s+j.amount-j.cost,0));let tm={},wm={};J.forEach(j=>{tm[j.type]=(tm[j.type]||0)+1;let w=j.worker||'未指定';wm[w]=(wm[w]||0)+1});$('typeStats').innerHTML=Object.entries(tm).map(([k,v])=>`<div class="card item"><b>${k}</b><span>${v} 件</span></div>`).join('')||'<div class="card empty">尚無資料</div>';$('workerStats').innerHTML=Object.entries(wm).map(([k,v])=>`<div class="card item"><b>${k}</b><span>${v} 件</span></div>`).join('')||'<div class="card empty">尚無資料</div>'}
function backup(){let b=new Blob([JSON.stringify(J,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='工程管家V4備份_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
home();
</script></body></html>
