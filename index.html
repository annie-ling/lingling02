<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b7a58f"><title>工程管家 V7.1</title>
<style>
:root{--bg:#f5f1eb;--card:#fffdf9;--ink:#302a24;--muted:#82786c;--line:#e5ddd3;--accent:#806a56;--accent2:#b7a58f;--soft:#eee6dc;--ok:#667967}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#efe8de,#f8f5f0 240px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.app{max-width:920px;margin:auto;padding:18px 14px 112px}.page{display:none}.page.on{display:block}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brandwrap{display:flex;align-items:center;gap:10px}.appicon{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#c8b9a5,#8f7964);display:grid;place-items:center;box-shadow:0 7px 18px #6d58452d}.appicon svg{width:29px;height:29px}.brand{font-size:23px;font-weight:900;letter-spacing:.5px}.sub,.meta{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 6px 22px #4e40320d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:22px;margin-top:5px}.stat .ico{font-size:20px}
h2{font-size:17px;margin:22px 2px 10px}label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white;font:inherit;margin:5px 0 10px}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;padding:12px 13px;background:var(--accent);color:#fff;font-weight:800}.btn.alt{background:var(--soft);color:var(--ink)}.actions{display:flex;gap:8px}.actions>*{flex:1}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:var(--soft);padding:5px 9px;border-radius:99px;font-size:11px}.empty{text-align:center;padding:26px;color:var(--muted)}
.pipeline{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.pipe{min-width:112px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px}.pipe b{font-size:20px;display:block}.progress{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:7px}.progress i{height:100%;display:block;background:var(--ok)}
.hero{padding:18px;background:linear-gradient(135deg,#fffdf9,#e9dfd2);border:1px solid #dfd3c5;border-radius:22px}.hero b{font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fffdf9f2;border-top:1px solid #ded4c8;backdrop-filter:blur(15px);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -6px 22px #5d4a3810}nav .wrap{max-width:920px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}nav button{border:0;background:none;color:#8a7c6d;font-size:13px;font-weight:750;padding:5px 1px;line-height:1.25}nav button svg{display:block;margin:0 auto 4px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}nav button.active{color:#66513f}nav button.active svg{stroke-width:2.5}.plus svg{background:var(--accent);stroke:white;border-radius:12px;padding:4px;width:31px;height:31px;margin-top:-8px}
#login{max-width:460px;margin:42px auto}.loginlogo{text-align:center;margin-bottom:16px}.loginlogo .appicon{margin:auto;width:68px;height:68px;border-radius:20px}.loginlogo .appicon svg{width:40px;height:40px}.loginlogo h1{margin:10px 0 2px}
@media(max-width:500px){.row{grid-template-columns:1fr}nav button{font-size:12px}nav button svg{width:23px;height:23px}} 
.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.detail-title{font-size:21px;font-weight:900}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 7px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 11px;color:var(--muted);font-weight:750}.tabs button.on{background:var(--accent);color:white}.mini{padding:9px 10px;border-radius:12px;background:var(--soft);margin:6px 0}.moneyline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}.moneyline:last-child{border:0}.danger{background:#f2dfdd!important;color:#934b43!important}.archive{background:#e9e3d7!important;color:#695d50!important}.detail-section{display:none}.detail-section.on{display:block}.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.photo-placeholder{border:1px dashed #cdbfae;border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:#faf7f2}

.site-card{border-left:4px solid var(--accent)}.quicklog{width:100%;padding:14px 16px;font-size:15px;font-weight:900;margin-top:10px}.today-label{font-size:12px;color:var(--muted);margin-bottom:3px}
</style><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"></head><body>
<div id="login" class="app"><div class="loginlogo"><div class="appicon"><svg viewBox="0 0 24 24" stroke="#fff" fill="none" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5 5L3.8 17.2a2 2 0 0 0 2.8 2.8l5.9-5.9a4 4 0 0 0 5.2-4.8l-2.5 2.5-3-3 2.5-2.5Z"/><path d="m15 15 5 5"/></svg></div><h1>工程管家</h1><div class="sub">V7.1 · 現場施工管理版</div></div><div class="card"><label>工程行／公司名稱</label><input id="co" placeholder="例：佑聖工程"><label>使用者名稱</label><input id="un" placeholder="例：阿豪"><label>角色</label><select id="role"><option value="owner">老闆</option><option value="admin">行政</option><option value="worker">師傅</option></select><input id="pw" type="password" placeholder="密碼"><button class="btn" style="width:100%" onclick="login()">登入工程管家</button><p class="sub">此包可直接部署測試。正式多人跨裝置同步需接你的 Supabase 專案。</p></div></div>
<div id="main" class="app" style="display:none"><header><div class="brandwrap"><div class="appicon"><svg viewBox="0 0 24 24" stroke="#fff" fill="none" stroke-width="1.8"><path d="M14.7 6.3a4 4 0 0 0-5 5L3.8 17.2a2 2 0 0 0 2.8 2.8l5.9-5.9a4 4 0 0 0 5.2-4.8l-2.5 2.5-3-3 2.5-2.5Z"/><path d="m15 15 5 5"/></svg></div><div><div class="brand">工程管家</div><div class="sub" id="who"></div></div></div><button class="btn alt" onclick="logout()">登出</button></header>
<section id="home" class="page on"><div class="hero"><div class="sub">今天的工程營運</div><b id="hello">工作順利 👋</b></div><div class="grid"><div class="card stat"><span class="ico">🛠</span><span class="sub">進行中</span><b id="sa">0</b></div><div class="card stat"><span class="ico">💰</span><span class="sub">待收款</span><b id="sd">$0</b></div><div class="card stat owner"><span class="ico">📈</span><span class="sub">本月工程額</span><b id="sr">$0</b></div><div class="card stat owner"><span class="ico">✓</span><span class="sub">已完工</span><b id="sf">0</b></div></div><h2>工程流程</h2><div id="pipe" class="pipeline"></div><h2>近期案件</h2><div id="recent"></div></section>
<section id="today" class="page"><h2>今日工地</h2><div id="todayList"></div></section>
<section id="jobs" class="page"><h2>工程案件</h2><input id="search" placeholder="搜尋客戶、電話、地址、師傅" oninput="renderJobs()"><div id="jobList"></div></section>
<section id="edit" class="page"><h2>工程資料</h2><div class="card"><input id="id" type="hidden"><label>客戶姓名</label><input id="client"><div class="row"><div><label>電話</label><input id="phone"></div><div><label>工程類型</label><select id="type"><option>冷氣安裝</option><option>冷氣維修</option><option>水電工程</option><option>弱電工程</option><option>居家修繕</option><option>裝潢工程</option><option>其他</option></select></div></div><label>施工地址</label><input id="addr"><div class="row"><div><label>施工日期</label><input id="date" type="date"></div><div><label>負責師傅</label><input id="worker"></div></div><label>工程狀態</label><select id="status"><option>新詢問</option><option>現勘</option><option>待報價</option><option>已報價</option><option>已收訂金</option><option>已排程</option><option>施工中</option><option>待驗收</option><option>待尾款</option><option>已完工</option></select><div class="row money"><div><label>工程總額</label><input id="amount" type="number" value="0"></div><div><label>已收款</label><input id="paid" type="number" value="0"></div></div><label>施工／保固紀錄</label><textarea id="note"></textarea><label>現場照片</label><input type="file" accept="image/*" multiple><div class="actions"><button class="btn" onclick="save()">儲存修改</button><button id="copyBtn" class="btn alt" style="display:none" onclick="copyJob()">複製案件</button></div><button id="deleteBtn" class="btn" style="display:none;width:100%;margin-top:8px;background:#f2dfdd;color:#934b43" onclick="removeJob()">刪除此工程</button></div></section>
<section id="detail" class="page"><div id="detailBody"></div></section><section id="clients" class="page"><h2>客戶管理</h2><div id="clientsList"></div></section>
<section id="more" class="page"><h2>更多功能</h2><div class="card"><b>☁️ 雲端同步</b><p class="sub">正式版可接 Supabase Auth、Database、Storage 與 RLS。</p></div><div class="card"><b>👥 團隊權限</b><p class="sub">老闆看完整財務；行政管理案件；師傅只看自己的工程。</p></div><div class="card"><b>📄 報價與保固</b><p class="sub">V7 已加入追加工程、分次收款、施工日誌與保固；下一階段接 Supabase 雲端同步。</p></div></section></div>
<nav id="nav" style="display:none"><div class="wrap">
<button class="active" data-p="home" onclick="go('home')"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9H6v-9"/><path d="M9 20v-6h6v6"/></svg>首頁</button>
<button data-p="today" onclick="go('today')"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>今日工地</button>
<button data-p="jobs" onclick="go('jobs')"><svg viewBox="0 0 24 24"><path d="M9 5h11v15H4V5h2"/><path d="M8 3h8v4H8zM8 12h8M8 16h6"/></svg>工程案件</button>
<button class="plus write" data-p="edit" onclick="fresh()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新增</button>
<button data-p="clients" onclick="go('clients')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-4 2-7 6-7s6 3 6 7M16 11c3 0 5 2 5 6"/></svg>客戶</button>
<button data-p="more" onclick="go('more')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>更多</button>
</div></nav>
<script>
const $=x=>document.getElementById(x),M=n=>'$'+Number(n||0).toLocaleString('zh-TW');let U=null,J=[];
function key(){return 'eng_v6_'+U.co+'_jobs'}function login(){if(!$('co').value||!$('un').value||!$('pw').value)return alert('請完整輸入');U={co:$('co').value,un:$('un').value,role:$('role').value};localStorage.setItem('v6session',JSON.stringify(U));boot()}function logout(){localStorage.removeItem('v6session');location.reload()}
function boot(){J=JSON.parse(localStorage.getItem(key())||'[]');$('login').style.display='none';$('main').style.display='block';$('nav').style.display='block';$('who').textContent=U.co+'｜'+U.un+'｜'+({owner:'老闆',admin:'行政',worker:'師傅'}[U.role]);$('hello').textContent=U.un+'，今天工作順利 👋';document.querySelectorAll('.owner').forEach(x=>x.style.display=U.role==='owner'?'':'none');document.querySelectorAll('.write').forEach(x=>x.style.display=U.role==='worker'?'none':'');document.querySelectorAll('.money').forEach(x=>x.style.display=U.role==='worker'?'none':'');home()}function vis(){return U.role==='worker'?J.filter(j=>j.worker===U.un):J}function persist(){localStorage.setItem(key(),JSON.stringify(J))}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(p).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));if(p==='home')home();if(p==='today')today();if(p==='jobs')renderJobs();if(p==='clients')clients();scrollTo(0,0)}
function card(j){let pct=j.amount?Math.min(100,j.paid/j.amount*100):0;return `<div class="card item" onclick="openDetail(${j.id})"><div style="flex:1"><b>${j.client}｜${j.type}</b><div class="meta">${j.date||'未排日期'} · ${j.worker||'未指定'}<br>${j.addr||''}</div><div class="progress"><i style="width:${pct}%"></i></div></div><span class="badge">${j.status}</span></div>`}
function home(){let v=vis(),ym=new Date().toISOString().slice(0,7);$('sa').textContent=v.filter(x=>x.status!=='已完工').length;$('sd').textContent=U.role==='worker'?'—':M(v.reduce((s,x)=>s+Math.max(0,x.amount-x.paid),0));$('sr').textContent=M(v.filter(x=>(x.date||'').startsWith(ym)).reduce((s,x)=>s+x.amount,0));$('sf').textContent=v.filter(x=>x.status==='已完工').length;let st=['新詢問','現勘','待報價','已報價','已排程','施工中','待驗收','待尾款','已完工'];$('pipe').innerHTML=st.map(s=>`<div class="pipe"><span class="sub">${s}</span><b>${v.filter(x=>x.status===s).length}</b></div>`).join('');$('recent').innerHTML=v.length?v.slice(0,5).map(card).join(''):'<div class="card empty">尚無工程案件</div>'}
function fresh(){if(U.role==='worker')return;['id','client','phone','addr','worker','note'].forEach(x=>$(x).value='');['amount','paid'].forEach(x=>$(x).value=0);$('date').value=new Date().toISOString().slice(0,10);$('status').value='新詢問';$('copyBtn').style.display='none';$('deleteBtn').style.display='none';go('edit')}
function save(){let id=+$('id').value||Date.now(),old=J.find(x=>x.id===id);if(U.role==='worker'&&!old)return;let now=new Date().toISOString();let j={...(old||{}),id,client:$('client').value||'未命名客戶',phone:$('phone').value,type:$('type').value,addr:$('addr').value,date:$('date').value,worker:$('worker').value,status:$('status').value,amount:U.role==='worker'?(old?.amount||0):+$('amount').value||0,paid:U.role==='worker'?(old?.paid||0):+$('paid').value||0,note:$('note').value,extras:old?.extras||[],payments:old?.payments||[],logs:old?.logs||[],warranty:old?.warranty||{start:'',end:'',note:''},archived:old?.archived||false,createdAt:old?.createdAt||now,updatedAt:now};J=J.filter(x=>x.id!==id);J.unshift(j);persist();go('jobs')}
function edit(id){let j=J.find(x=>x.id===id);if(U.role==='worker'&&j.worker!==U.un)return;['client','phone','type','addr','date','worker','status','amount','paid','note'].forEach(x=>$(x).value=j[x]??'');$('id').value=id;$('copyBtn').style.display=U.role==='worker'?'none':'block';$('deleteBtn').style.display=U.role==='owner'?'block':'none';go('edit')}
function removeJob(){let id=+$('id').value,j=J.find(x=>x.id===id);if(!j)return;if(U.role!=='owner')return alert('只有老闆帳號可以刪除工程');if(confirm(`確定要刪除「${j.client}｜${j.type}」嗎？\n\n刪除後將無法復原。`)){J=J.filter(x=>x.id!==id);persist();alert('工程已刪除');go('jobs')}}
function copyJob(){let id=+$('id').value,j=J.find(x=>x.id===id);if(!j||U.role==='worker')return;let n={...j,id:Date.now(),client:j.client+'（副本）',status:'新詢問',paid:0,date:new Date().toISOString().slice(0,10)};J.unshift(n);persist();alert('案件已複製');go('jobs')}

let D=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openDetail(id){D=id;renderDetail();go('detail')}
function detailTab(n){document.querySelectorAll('.detail-section').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));$('ds'+n).classList.add('on');$('dt'+n).classList.add('on')}
function renderDetail(){let j=J.find(x=>x.id===D);if(!j)return go('jobs');j.extras=j.extras||[];j.payments=j.payments||[];j.logs=j.logs||[];j.warranty=j.warranty||{start:'',end:'',note:''};let extra=j.extras.reduce((s,x)=>s+(+x.amount||0),0),paylog=j.payments.reduce((s,x)=>s+(+x.amount||0),0),received=Math.max(+j.paid||0,paylog),grand=(+j.amount||0)+extra,balance=Math.max(0,grand-received);let finance=U.role==='worker'?'':`<div class="card"><div class="moneyline"><span>原工程金額</span><b>${M(j.amount)}</b></div><div class="moneyline"><span>追加工程</span><b>${M(extra)}</b></div><div class="moneyline"><span>最終工程額</span><b>${M(grand)}</b></div><div class="moneyline"><span>累計收款</span><b>${M(received)}</b></div><div class="moneyline"><span>待收款</span><b>${M(balance)}</b></div></div>`;let extras=j.extras.length?j.extras.map((x,i)=>`<div class="mini"><b>${esc(x.title)}</b><div class="meta">${esc(x.date)} · ${M(x.amount)}</div>${esc(x.note||'')}</div>`).join(''):'<div class="empty">尚無追加工程</div>';let payments=j.payments.length?j.payments.map(x=>`<div class="mini"><b>${M(x.amount)}</b><div class="meta">${esc(x.date)} · ${esc(x.method||'未填方式')}</div>${esc(x.note||'')}</div>`).join(''):'<div class="empty">尚無分次收款紀錄</div>';let logs=j.logs.length?j.logs.map(x=>`<div class="mini"><b>${esc(x.date)}｜${esc(x.worker||'未填施工人員')}</b><div class="meta">${esc(x.category||'施工紀錄')}</div>${esc(x.text)}</div>`).join(''):'<div class="empty">尚無施工日誌</div>';
$('detailBody').innerHTML=`<div class="card"><div class="detail-head"><div><div class="detail-title">${esc(j.client)}｜${esc(j.type)}</div><div class="meta">${esc(j.phone)} · ${esc(j.addr)}</div><div class="tagrow"><span class="badge">${esc(j.status)}</span>${j.archived?'<span class="badge">已封存</span>':''}<span class="badge">${esc(j.worker||'未指定師傅')}</span></div></div><button class="btn alt" onclick="edit(${j.id})">編輯</button></div></div><div class="tabs"><button id="dt1" class="on" onclick="detailTab(1)">總覽</button><button id="dt2" onclick="detailTab(2)">追加工程</button><button id="dt3" onclick="detailTab(3)">收款</button><button id="dt4" onclick="detailTab(4)">施工日誌</button><button id="dt5" onclick="detailTab(5)">照片</button><button id="dt6" onclick="detailTab(6)">保固</button></div>
<div id="ds1" class="detail-section on">${finance}<div class="card"><b>工程資訊</b><p class="meta">施工日期：${esc(j.date||'未排定')}<br>負責師傅：${esc(j.worker||'未指定')}<br>建立：${esc((j.createdAt||'').slice(0,10)||'舊資料')}<br>最後修改：${esc((j.updatedAt||'').slice(0,16).replace('T',' ')||'—')}</p><p>${esc(j.note||'尚無備註')}</p></div><button class="btn quicklog" onclick="detailTab(4)">＋ 新增今日施工紀錄</button><div class="actions">${U.role==='worker'?'':`<button class="btn alt" onclick="copyJobFromDetail()">複製案件</button><button class="btn archive" onclick="toggleArchive()">${j.archived?'解除封存':'封存案件'}</button>`}</div>${U.role==='owner'?'<button class="btn danger" style="width:100%;margin-top:8px" onclick="removeDetailJob()">刪除此工程</button>':''}</div>
<div id="ds2" class="detail-section"><div class="card">${extras}</div>${U.role==='worker'?'':`<div class="card"><label>追加項目</label><input id="exTitle" placeholder="例：追加插座 2 組"><div class="row"><div><label>追加日期</label><input id="exDate" type="date"></div><div><label>追加金額</label><input id="exAmount" type="number" value="0"></div></div><label>說明</label><textarea id="exNote"></textarea><button class="btn" style="width:100%" onclick="addExtra()">新增追加工程</button></div>`}</div>
<div id="ds3" class="detail-section">${U.role==='worker'?'<div class="card empty">師傅帳號不顯示財務資料</div>':`<div class="card">${payments}</div><div class="card"><div class="row"><div><label>收款日期</label><input id="payDate" type="date"></div><div><label>收款金額</label><input id="payAmount" type="number" value="0"></div></div><label>方式</label><select id="payMethod"><option>轉帳</option><option>現金</option><option>支票</option><option>其他</option></select><label>備註</label><input id="payNote"><button class="btn" style="width:100%" onclick="addPayment()">新增收款紀錄</button></div>`}</div>
<div id="ds4" class="detail-section"><div class="card"><b style="font-size:18px">施工日誌</b><div class="sub">記錄每天實際完成內容、施工人員、異常與客戶追加需求。</div></div><div class="card">${logs}</div><div class="card"><b>＋ 新增今日施工紀錄</b><div class="row"><div><label>日期</label><input id="logDate" type="date"></div><div><label>施工人員</label><input id="logWorker" value="${esc(U.un)}"></div></div><label>分類</label><select id="logCat"><option>施工紀錄</option><option>現場異常</option><option>客戶追加需求</option><option>驗收紀錄</option><option>保固處理</option></select><label>今日內容</label><textarea id="logText" placeholder="今天完成什麼、使用材料、異常狀況…"></textarea><button class="btn" style="width:100%" onclick="addLog()">新增施工日誌</button></div></div>
<div id="ds5" class="detail-section"><div class="card"><div class="photo-placeholder">📷 V7 已先建立照片分類介面<br><span class="sub">施工前｜施工中｜完工｜異常｜保固<br>正式雲端版會接 Supabase Storage，避免照片塞進手機瀏覽器。</span></div></div></div>
<div id="ds6" class="detail-section"><div class="card"><div class="row"><div><label>保固開始</label><input id="warStart" type="date" value="${esc(j.warranty.start)}"></div><div><label>保固到期</label><input id="warEnd" type="date" value="${esc(j.warranty.end)}"></div></div><label>保固說明</label><textarea id="warNote">${esc(j.warranty.note)}</textarea>${U.role==='worker'?'':'<button class="btn" style="width:100%" onclick="saveWarranty()">儲存保固資訊</button>'}</div></div>`;['exDate','payDate','logDate'].forEach(id=>{if($(id)&&!$(id).value)$(id).value=new Date().toISOString().slice(0,10)})}
function addExtra(){let j=J.find(x=>x.id===D);if(!j)return;let title=$('exTitle').value.trim();if(!title)return alert('請輸入追加項目');j.extras=j.extras||[];j.extras.unshift({id:Date.now(),title,date:$('exDate').value,amount:+$('exAmount').value||0,note:$('exNote').value});j.updatedAt=new Date().toISOString();persist();renderDetail();detailTab(2)}
function addPayment(){let j=J.find(x=>x.id===D);if(!j)return;let a=+$('payAmount').value||0;if(a<=0)return alert('請輸入收款金額');j.payments=j.payments||[];j.payments.unshift({id:Date.now(),date:$('payDate').value,amount:a,method:$('payMethod').value,note:$('payNote').value});j.paid=j.payments.reduce((s,x)=>s+(+x.amount||0),0);j.updatedAt=new Date().toISOString();persist();renderDetail();detailTab(3)}
function addLog(){let j=J.find(x=>x.id===D);if(!j)return;let x=$('logText').value.trim();if(!x)return alert('請輸入施工內容');j.logs=j.logs||[];j.logs.unshift({id:Date.now(),date:$('logDate').value,worker:$('logWorker').value,category:$('logCat').value,text:x});j.updatedAt=new Date().toISOString();persist();renderDetail();detailTab(4)}
function saveWarranty(){let j=J.find(x=>x.id===D);if(!j)return;j.warranty={start:$('warStart').value,end:$('warEnd').value,note:$('warNote').value};j.updatedAt=new Date().toISOString();persist();alert('保固資訊已儲存');renderDetail();detailTab(6)}
function toggleArchive(){let j=J.find(x=>x.id===D);if(!j)return;j.archived=!j.archived;j.updatedAt=new Date().toISOString();persist();renderDetail()}
function copyJobFromDetail(){let j=J.find(x=>x.id===D);if(!j)return;let now=new Date().toISOString();let n={...j,id:Date.now(),client:j.client+'（副本）',status:'新詢問',paid:0,payments:[],logs:[],extras:[],archived:false,date:now.slice(0,10),createdAt:now,updatedAt:now};J.unshift(n);persist();alert('案件已複製');go('jobs')}
function removeDetailJob(){let j=J.find(x=>x.id===D);if(!j||U.role!=='owner')return;if(confirm(`確定要刪除「${j.client}｜${j.type}」嗎？\n\n追加工程、收款紀錄與施工日誌也會一起刪除，且無法復原。`)){J=J.filter(x=>x.id!==D);persist();D=null;alert('工程已刪除');go('jobs')}}
function renderJobs(){let q=$('search').value.toLowerCase(),v=vis().filter(j=>[j.client,j.phone,j.addr,j.worker,j.type].join(' ').toLowerCase().includes(q));$('jobList').innerHTML=v.length?v.map(card).join(''):'<div class="card empty">沒有符合案件</div>'}
function today(){let d=new Date().toISOString().slice(0,10),v=vis().filter(j=>j.date===d);$('todayList').innerHTML=v.length?v.map(card).join(''):'<div class="card empty">今天沒有排定工程</div>'}
function clients(){let m={};vis().forEach(j=>{let k=j.phone||j.client;if(!m[k])m[k]={name:j.client,phone:j.phone,n:0,total:0};m[k].n++;m[k].total+=j.amount});let a=Object.values(m);$('clientsList').innerHTML=a.length?a.map(c=>`<div class="card item"><div><b>${c.name}</b><div class="meta">${c.phone||'未填電話'} · ${c.n} 件工程</div></div>${U.role==='worker'?'':`<b>${M(c.total)}</b>`}</div>`).join(''):'<div class="card empty">尚無客戶資料</div>'}
U=JSON.parse(localStorage.getItem('v6session')||'null');if(U)boot();
</script></body></html>
